# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Apply database migrations
        working-directory: backend
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://vitaforge:vitaforge@localhost:5432/vitaforge?schema=public

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Test backend
        run: npm run test --prefix backend -- --runInBand

      - name: Test backend integration flows
        working-directory: backend
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://vitaforge:vitaforge@localhost:5432/vitaforge?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Test frontend workflows
        run: npm run test:e2e --prefix frontend

      - name: Stop services
        if: always()
        run: docker compose down -v
